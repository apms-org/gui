name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # A dev build of pm (not --release), so CI tracks the CLI's master.
    env:
      APM_CLI_REPO: https://github.com/apms-org/apm.git
      APM_CLI_REF: ${{ vars.APM_CLI_REF || 'master' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - run: npm ci

      - name: Test shell
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build backend
        run: npm run build:backend
