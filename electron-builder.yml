appId: com.aaravmaloo.apm
productName: APM
copyright: Copyright 2026 aaravmaloo

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - dist/**/*
  - package.json

extraResources:
  - from: bin
    to: bin
    filter:
      - pm
      - pm.exe

npmRebuild: false
asar: true
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.productivity
  # Inline Touch ID for the lock screen, built by npm run build:native.
  extraResources:
    - from: native/build
      to: native
      filter:
        - "*.node"
  target:
    - dir
  # Icon Composer source. electron-builder compiles it with actool (Xcode 26+)
  # into Assets.car and sets CFBundleIconName, so macOS 26+ draws the glass,
  # the shadow and the Default, Dark, Clear and Tinted styles itself.
  icon: build/AppIcon.icon
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - dir

linux:
  target:
    - dir
  category: Utility
